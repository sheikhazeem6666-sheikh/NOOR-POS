      return u.map(x => `<option value="${khEsc(x)}" ${x.toLowerCase() === String(cur).toLowerCase() ? 'selected' : ''}>${khEsc(x)}</option>`).join('');
    }
    function slFmt(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
    function slDateChange() { const d = document.getElementById('sl-date'), dt = document.getElementById('sl-datetxt'); if (d && dt) { dt.value = slFmt(d.value); dt.style.borderColor = ''; } }
    function slPickDate() { const d = document.getElementById('sl-date'); if (!d) return; if (d.showPicker) { try { d.showPicker(); return; } catch (e) { } } d.focus(); }
    function slDateTxt() {
      const dt = document.getElementById('sl-datetxt'), d = document.getElementById('sl-date');
      const v = dt.value.replace(/\D/g, '').slice(0, 8);
      dt.value = v.length > 4 ? v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4) : v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
      let iso = '';
      if (v.length === 8) {
        const dd = +v.slice(0, 2), mm = +v.slice(2, 4), yy = +v.slice(4), x = new Date(yy, mm - 1, dd);
        if (yy >= 2000 && x.getFullYear() === yy && x.getMonth() === mm - 1 && x.getDate() === dd) iso = yy + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
      }
      d.value = iso;
      dt.style.borderColor = (v.length === 8 && !iso) ? '#e11d48' : '';
    }
    function slToggleDT() {
      const d = document.getElementById('sl-date'), dt = document.getElementById('sl-datetxt'), t = document.getElementById('sl-time'), b = document.getElementById('sl-dtbtn'), cb = document.getElementById('sl-calbtn');
      const lock = !dt.classList.contains('sl-lock');
      [dt, t].forEach(el => { el.classList.toggle('sl-lock', lock); if (lock) { el.setAttribute('readonly', ''); el.tabIndex = -1; } else { el.removeAttribute('readonly'); el.tabIndex = 0; } });
      cb.style.pointerEvents = lock ? 'none' : ''; cb.style.opacity = lock ? '.5' : '';
      b.textContent = lock ? '✏️ Edit' : '🔒 Lock';
      if (lock) { const n = slNow(); d.value = n.date; dt.value = slFmt(n.date); t.value = n.time; dt.style.borderColor = ''; }
    }
    function slHideList() { const bx = document.getElementById('sl-list'); if (bx) bx.style.display = 'none'; }
    function slShowList() {
      const inpEl = document.getElementById('sl-itemname'), bx = document.getElementById('sl-list');
      if (!inpEl || !bx || inpEl.disabled) return;
      const raw = inpEl.value.trim(), t = raw.toLowerCase();
      const hits = appData.stock.filter(s => !t || s.name.toLowerCase().includes(t)).slice(0, 8);
      let h = hits.map(s => `<div class="sl-opt" onmousedown="event.preventDefault();slPick('${s.id}')"><span>${khEsc(s.name)}</span><small>${s.qty} ${khEsc(s.unit)}</small></div>`).join('');
      if (t && !appData.stock.some(s => s.name.trim().toLowerCase() === t)) h += `<div class="sl-opt sl-add" onmousedown="event.preventDefault();slHideList()">➕ "${khEsc(raw)}" naya item add karein</div>`;
      if (!h) h = '<div class="sl-opt" style="color:#94a3b8;cursor:default;">Abhi koi item nahi — naam likhein</div>';
      bx.innerHTML = h; bx.style.display = 'block';
    }
    function slPick(id) {
      const it = appData.stock.find(x => x.id === id); if (!it) return;
      document.getElementById('sl-itemname').value = it.name;
      document.getElementById('sl-item').value = it.id;
      slHideList(); slItemChange();
    }
    function slItemInput() {
      const raw = document.getElementById('sl-itemname').value.trim();
      const m = appData.stock.find(s => s.name.trim().toLowerCase() === raw.toLowerCase());
      document.getElementById('sl-item').value = m ? m.id : (raw ? '__new__' : '');
      slShowList(); slItemChange();
    }
    function slItemChange() {
      const sel = document.getElementById('sl-item'); if (!sel) return;
      const nm = document.getElementById('sl-itemname');
      document.getElementById('sl-newname').value = sel.value === '__new__' ? nm.value.trim() : '';
      const it = appData.stock.find(x => x.id === sel.value);
      const un = document.getElementById('sl-newunit');
      if (un) {
        if (it) { un.innerHTML = slUnitOpts(it.unit); un.disabled = true; }
        else { const keep = un.disabled ? 'KG' : un.value; un.innerHTML = slUnitOpts(keep); un.disabled = false; }
      }
      if (it && slCtx && slCtx.type === 'amad' && !slCtx.edit) {
        const r = document.getElementById('sl-rate'), nt = document.getElementById('sl-note');
        if (r && r.value === '' && it.cost) { r.value = it.cost; slCalc(); }
        if (nt && nt.value === '' && it.supplier) nt.value = it.supplier;
      }
      const qu = document.getElementById('sl-qunit'); if (qu) qu.textContent = un && sel.value ? '(' + un.value + ')' : '';
      const hint = document.getElementById('sl-hint');
      if (hint) {
        if (sel.value === '__new__') { hint.style.color = '#c2410c'; hint.textContent = 'Naya item — save karne par stock list mein add ho jayega. Unit neeche chunein.'; }
        else if (it) { hint.style.color = '#059669'; hint.textContent = '✓ Maujooda item (unit: ' + it.unit + ')'; }
        else hint.textContent = '';
      }
      slSysUpdate();
    }
    function slSysUpdate() {
      const el = document.getElementById('sl-sys'); if (!el) return;
      const idv = document.getElementById('sl-item').value;
      if (!idv) { el.innerHTML = 'Item chunein — system ka baqaya yahan khud dikh jayega.'; return; }
      const it = appData.stock.find(x => x.id === idv);
      const un = it ? it.unit : ((document.getElementById('sl-newunit') || {}).value || ''), sys = it ? it.qty : 0, cost = it ? Number(it.cost) || 0 : 0;
      const qv = document.getElementById('sl-qty').value;
      const box = (l, v, c) => '<div style="flex:1;min-width:90px;text-align:center;"><div style="font-size:10px;color:#64748b;font-weight:700;">' + l + '</div><div style="font-size:16px;font-weight:800;color:' + (c || '#0f172a') + ';">' + v + '</div></div>';
      let h = '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + box('SYSTEM', sys + ' ' + khEsc(un));
      if (qv !== '') {
        const d = Math.round((Number(qv) - sys) * 1000) / 1000, c = d < 0 ? '#e11d48' : d > 0 ? '#059669' : '#475569';
        h += box('ASAL GINTI', khEsc(qv) + ' ' + khEsc(un)) + box('FARQ (auto)', (d > 0 ? '+' : '') + d + ' ' + khEsc(un), c) + (cost && d ? box('FARQ VALUE', (d > 0 ? '+' : '-') + 'PKR ' + Math.abs(Math.round(d * cost)).toLocaleString(), c) : '') + '</div>';
        h += '<div style="text-align:center;font-size:12px;font-weight:700;margin-top:6px;color:' + c + ';">' + (d === 0 ? '✓ Bilkul theek hai' : d < 0 ? 'System se ' + Math.abs(d) + ' ' + khEsc(un) + ' kam hai' : 'System se ' + d + ' ' + khEsc(un) + ' zyada hai') + '</div>';
      } else h += '</div><div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:6px;">Asal ginti likhte hi Farq khud nikal aayega</div>';
      el.innerHTML = h;
    }
    function slPickFocus(id) { const f = document.getElementById('sl-itemname'); if (!f || f.disabled) return; slPick(id); const q = document.getElementById('sl-qty'); if (q) q.focus(); }
    function slReset() { if (slCtx) { slCtx.edit = null; renderStockLog(); } }
    function slCalc() {
      const q = parseFloat(document.getElementById('sl-qty').value), r = document.getElementById('sl-rate') ? parseFloat(document.getElementById('sl-rate').value) : 0;
      if (q > 0 && r > 0 && document.getElementById('sl-amount')) document.getElementById('sl-amount').value = Math.round(q * r * 100) / 100;
      slSysUpdate();
    }
    async function slSave() {
      const c = slCtx; if (!c) return;
      const g = id => { const el = document.getElementById('sl-' + id); return el ? el.value : ''; };
      const isB = c.type === 'baqaya';
      let it = appData.stock.find(x => x.id === g('item'));
      let newIt = null;
      if (g('item') === '__new__') {
        const nm = g('newname').trim();
        if (!nm) { alert('Item ka naam likhein'); return; }
        it = newIt = { id: 's' + Date.now(), name: nm, unit: g('newunit').trim() || 'KG', qty: 0, min: 0, cost: 0, supplier: '' };
      }
      if (!it) { alert('Item chunein'); return; }
      const qty = Number(g('qty'));
      if (isB ? (g('qty') === '' || qty < 0) : !(qty > 0)) { alert(isB ? 'Asal baqaya likhein' : 'Miqdar likhein'); return; }
      const _dt = document.getElementById('sl-datetxt');
      if (_dt && !_dt.classList.contains('sl-lock') && !g('date')) { alert('Tareekh DD/MM/YYYY mein sahi likhein (jaise 12/10/2026)'); return; }
      if (newIt) appData.stock.push(newIt);
      const n = slNow(), dEl = document.getElementById('sl-datetxt'), auto = !c.edit && dEl && dEl.classList.contains('sl-lock');
      const date = auto ? n.date : (g('date') || n.date), time = auto ? n.time : (g('time') || n.time);
      const ts = new Date(date + 'T' + time).getTime() || Date.now();
      const base = { date: date, time: time, ts: ts, note: g('note').trim() };
      let toastMsg = '✓ Entry save ho gayi';
      let printId = null;
      const money = !isB && c.type !== 'use';
      const rate = money ? Number(g('rate')) || 0 : 0;
      const amount = money ? (Number(g('amount')) || rate * qty) : 0;
      if (c.edit) {
        const e = appData.stockLog.find(x => x.id === c.edit);
        if (e.cancelled) { alert('Cancelled entry edit nahi ho sakti'); return; }
        const snap = { ts: Date.now(), date: e.date, time: e.time, name: e.name, qty: e.qty, rate: e.rate, amount: e.amount, note: e.note, before: e.before, after: e.after };
        if (!isB) { slApply(e, -1); }
        Object.assign(e, base);
        if (!isB) {
          if (c.type !== 'amad' && qty > it.qty && e.itemId !== it.id && !confirm('Stock mein sirf ' + it.qty + ' ' + it.unit + ' hai. Phir bhi?')) { slApply(e, 1); return; }
          Object.assign(e, { itemId: it.id, name: it.name, unit: it.unit, qty: qty, rate: rate, amount: amount });
          e.before = it.qty;
          slApply(e, 1);
          e.after = it.qty;
        }
        e.history = (e.history || []).concat([snap]); e.editedTs = Date.now();
        printId = e.id;
        c.edit = null;
      } else if (isB) {
        const sys = it.qty;
        if (sys > 0 && Math.abs(qty - sys) / sys > 0.10 && !await uiConfirm('⚠️ Farq bara hai (' + Math.round(Math.abs(qty - sys) / sys * 100) + '%)\n\nSystem: ' + sys + ' ' + it.unit + '\nAsal ginti: ' + qty + ' ' + it.unit + '\n\nGinti dobara check kar li? Phir bhi save karein?')) return;
        printId = slPush({ ...base, type: 'baqaya', itemId: it.id, name: it.name, unit: it.unit, qty: qty, sys: sys, before: sys, after: qty, diff: Math.round((qty - sys) * 1000) / 1000, diffAmt: Math.round((qty - sys) * (Number(it.cost) || 0)) }).id;
        it.qty = qty;
        const dd = Math.round((qty - sys) * 1000) / 1000;
        toastMsg = '✓ ' + it.name + ': stock ' + sys + ' → ' + qty + ' ' + it.unit + ' (Farq ' + (dd > 0 ? '+' : '') + dd + ')';
      } else {
        if (SL[c.type].sign < 0 && qty > it.qty && !await uiConfirm('Stock mein sirf ' + it.qty + ' ' + it.unit + ' hai. Phir bhi nikalna hai?')) return;
        const e = { ...base, type: c.type, itemId: it.id, name: it.name, unit: it.unit, qty: qty, rate: rate, amount: amount };
        const le = slPush({ ...e, before: it.qty });
        slApply(le, 1);
        le.after = it.qty;
        printId = le.id;
        toastMsg = '✓ ' + it.name + ': ' + le.before + ' → ' + le.after + ' ' + it.unit;
      }
      saveData(); renderStock(); renderStockLog(); slToast(toastMsg);
      if (printId) { const pid = printId; setTimeout(async () => { if (await uiConfirm('Is entry ki parchi print karein?')) printStockEntry(pid); }, 250); }
    }
    function slToast(m) { uiToast(m, 'ok'); }
    // Delete ki jagah CANCEL: record mitta nahi, stock wapas theek hota hai, wajah likhna lazmi hai
    async function slDelete(id) {
      const e = appData.stockLog.find(x => x.id === id); if (!e || e.cancelled) return;
      const why = await uiPrompt('"' + e.name + '" (' + e.qty + ' ' + e.unit + ') ki entry CANCEL karein?\n\nEntry mitegi nahi, "Cancelled" mark ho jayegi aur stock wapas theek ho jayega.\n\nCancel ki wajah likhein (lazmi):', '');

    // Poori list ki parchi (aakhri 25 entries, cancelled shamil nahi)
    function printStockLogList(type) {
      const T = { amad: 'STOCK AMAD LIST', use: 'STOCK USE LIST', sale: 'STOCK SALE OUT LIST', baqaya: 'STOCK GINTI LIST' };
      const all = appData.stockLog.filter(x => x.type === type && !x.cancelled).sort((a, b) => (b.ts || 0) - (a.ts || 0));
      if (!all.length) { alert('Is list mein abhi koi entry nahi'); return; }
      const list = all.slice(0, 25);
      const rows = [{ t: 'Total entries: ' + all.length + (all.length > 25 ? ' (aakhri 25)' : '') }, { sep: 1 }];
      let tot = 0;
      list.forEach(e => {
        const u = e.unit || '';
        rows.push({ l: (slFmt(e.date).slice(0, 5) || '--') + ' ' + (e.time || ''), r: e.name });
        if (type === 'baqaya') rows.push({ t: '  System ' + (e.sys ?? 0) + ' -> Ginti ' + e.qty + ' ' + u });
        else {
          rows.push({ l: '  ' + e.qty + ' ' + u, r: e.amount ? 'PKR ' + pk(e.amount) : '' });
          if (e.before !== undefined && e.after !== undefined) rows.push({ t: '  ' + e.before + ' -> ' + e.after + ' ' + u });
          tot += Number(e.amount) || 0;
        }
        if (e.note) rows.push({ t: '  ' + e.note });
      });
      const totals = tot ? [{ l: 'TOTAL:', r: 'PKR ' + pk(tot), b: 1 }] : [];
      printSlip({ kind: 'stock', title: T[type], rows: rows, totals: totals });
    }

    // ---- Har stock entry ki parchi ----
    function printStockEntry(id) {
      const e = appData.stockLog.find(x => x.id === id); if (!e) return;
      const T = { amad: 'STOCK AMAD SLIP', use: 'STOCK USE SLIP', sale: 'STOCK SALE OUT SLIP', baqaya: 'STOCK GINTI SLIP' };
      const u = e.unit || '';
      const rows = [{ l: 'Item:', r: e.name }, { l: 'Date:', r: (slFmt(e.date) || e.date) + ' ' + (e.time || '') }, { sep: 1 }];
      const totals = [];
      if (e.type === 'baqaya') {
        const d = Math.round((Number(e.qty) - (Number(e.sys) || 0)) * 1000) / 1000;
        rows.push({ l: 'System:', r: (e.sys ?? 0) + ' ' + u }, { l: 'Asal ginti:', r: e.qty + ' ' + u, b: 1 }, { l: 'Farq:', r: (d > 0 ? '+' : '') + d + ' ' + u });
      } else {
        rows.push({ l: 'Miqdar:', r: e.qty + ' ' + u, b: 1 });
        if (e.rate) rows.push({ l: 'Rate:', r: 'PKR ' + pk(e.rate) });
        if (e.before !== undefined && e.after !== undefined) rows.push({ sep: 1 }, { l: 'Pehle:', r: e.before + ' ' + u }, { l: 'Baad:', r: e.after + ' ' + u, b: 1 });
        if (e.amount) totals.push({ l: 'TOTAL:', r: 'PKR ' + pk(e.amount), b: 1 });
      }
      if (e.note) rows.push({ sep: 1 }, { t: 'Tafseel: ' + e.note });
      if (e.cancelled) rows.push({ sep: 1 }, { t: '*** CANCELLED ***' }, { t: 'Wajah: ' + (e.cancelNote || '-') });
      if ((e.history || []).length) rows.push({ t: '(Edit hui ' + e.history.length + ' baar)' });
      printSlip({ kind: 'stock', title: T[e.type] || 'STOCK SLIP', party: e.name, refKey: 'stk:' + e.id + ':' + (e.history || []).length + (e.cancelled ? ':x' : ''), rows: rows, totals: totals, sign: false });
    }

    // ---- Stock parchi ----
    async function stockMove(id, dir) {
      const it = appData.stock.find(s => s.id === id);
      if (!it) return;
      const q = Number(await uiPrompt((dir < 0 ? 'Kitna istemal / nikala' : 'Kitna maal aaya') + ' (' + it.unit + ')?', '1'));
      if (!(q > 0)) return;
      if (dir < 0 && q > it.qty && !await uiConfirm('Stock mein sirf ' + it.qty + ' ' + it.unit + ' hai. Phir bhi nikalna hai?')) return;
      const note = await uiPrompt(dir < 0 ? 'Kis kaam ke liye / kis ko diya (optional):' : 'Supplier / note (optional):', dir > 0 ? (it.supplier || '') : '');
      if (note === null) return;
      const _before = it.qty;
      it.qty = Math.max(0, Math.round((it.qty + dir * q) * 1000) / 1000);
      slPush({ before: _before, after: it.qty, type: dir > 0 ? 'amad' : 'use', itemId: it.id, name: it.name, unit: it.unit, qty: q, rate: dir > 0 ? (it.cost || 0) : 0, amount: dir > 0 ? (it.cost || 0) * q : 0, note: (note || '').trim() });
      saveData(); renderStock();
      const rows = [{ l: 'Item:', r: it.name }, { l: 'Miqdar:', r: q + ' ' + it.unit, b: 1 }];
      if (dir > 0 && it.cost) rows.push({ l: 'Rate:', r: pk(it.cost) });
      if (note.trim()) rows.push({ t: (dir < 0 ? 'Kis liye: ' : 'Supplier: ') + note.trim() });
      const totals = dir > 0 && it.cost ? [{ l: 'TOTAL:', r: 'PKR ' + pk(it.cost * q), b: 1 }] : [];
      totals.push({ l: 'Ab stock:', r: it.qty + ' ' + it.unit });
      printSlip({ kind: 'stock', title: dir < 0 ? 'STOCK OUT / USE SLIP' : 'PURCHASE / STOCK IN SLIP', party: it.name, rows: rows, totals: totals, sign: dir < 0 });
    }
    // Ek item ki parchi: maujooda stock + aakhri entries (pehle -> baad)
    function printStockItem(id) {
      const it = appData.stock.find(x => x.id === id); if (!it) return;
      const nm = { amad: 'Amad', use: 'Use', sale: 'Sale', baqaya: 'Ginti' };
      const logs = (appData.stockLog || []).filter(e => e.itemId === id && !e.cancelled).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 8);
      const rows = [{ l: 'Item:', r: it.name }, { l: 'Maujooda stock:', r: it.qty + ' ' + it.unit, b: 1 }, { sep: 1 }];
      if (!logs.length) rows.push({ t: 'Abhi koi entry nahi' });
      logs.forEach(e => {
        rows.push({ l: (slFmt(e.date).slice(0, 5) || '--') + ' ' + (e.time || '') + ' ' + (nm[e.type] || e.type), r: e.qty + ' ' + (e.unit || '') });
        if (e.before !== undefined && e.after !== undefined) rows.push({ t: '   ' + e.before + ' -> ' + e.after + ' ' + (e.unit || '') });
      });
      printSlip({ kind: 'stock', title: 'STOCK ITEM SLIP', party: it.name, rows: rows });
    }

      const rows = appData.stock.map(s => ({ l: s.name + (s.qty <= s.min ? ' (LOW)' : ''), r: s.qty + ' ' + s.unit }));

      if (!ms) return '';
      const d = new Date(ms), now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      return sameDay ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

      if (left <= 0) return { open: false, txt: '⏰ 24 ghante guzar gaye — ab sirf template message ja sakta hai' };
      const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);

        if (window.lamejs) return resolve();
        const sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';

    async function blobToMp3(blob) {
      await loadLame();
      const buf = await blob.arrayBuffer();
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const audio = await ac.decodeAudioData(buf);
      try { ac.close(); } catch (e) {}
      const ch = audio.getChannelData(0);
      const pcm = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) { const v = Math.max(-1, Math.min(1, ch[i])); pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
      const enc = new lamejs.Mp3Encoder(1, audio.sampleRate, 64);
      const out = [];
      for (let i = 0; i < pcm.length; i += 1152) {
        const b = enc.encodeBuffer(pcm.subarray(i, i + 1152));
        if (b.length) out.push(new Uint8Array(b));

      const e = enc.flush(); if (e.length) out.push(new Uint8Array(e));
      return new Blob(out, { type: 'audio/mpeg' });

            ${msgs.length ? (() => { let _ld = ''; return msgs.map(m => { const _ms = inboxMs(m.timestamp); const _d = _ms ? new Date(_ms) : null; const _dk = _d ? _d.toDateString() : ''; let _sep = ''; if (_dk && _dk !== _ld) { _ld = _dk; const _t = new Date(); const _y = new Date(Date.now() - 86400000); _sep = '<div class="msg-day">' + (_dk === _t.toDateString() ? 'Aaj' : _dk === _y.toDateString() ? 'Kal' : _d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) + '</div>'; } return _sep + `<div class="msg-b ${m.direction === 'out' ? 'out' : 'in'}">${inboxQuoteHtml(m, msgs)}${khEsc(m.text === '[revoke]' ? '🚫 Ye message delete kar diya gaya' : (m.text || ''))}${inboxMediaHtml(m)}
              <div class="mt">${_ms ? _d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''}${msgTick(m)}${m._docId && String(m._docId).indexOf('dash_') !== 0 ? '<span class="msg-rp" data-docid="' + khEsc(m._docId) + '" onclick="setReplyTo(this)">↩ Jawab</span>' : ''}${m.source === 'staff_phone' ? ' · 📱 phone se' : m.source === 'dashboard' ? ' · 💻 dashboard se' : ''}${m._docId ? '<span class="msg-del" title="Sirf POS se hatayen" data-docid="' + khEsc(m._docId) + '" onclick="deleteInboxMsg(this)">🗑</span>' : ''}</div></div>`; }).join(''); })()
              : (window._inboxMsgsFor === msgSel && window._inboxMsgsState === 'error'
                  ? '<div class="msg-empty">❌ Messages load nahi ho sake (Firestore rules check karein). Browser console mein detail hai.</div>'
                  : (window._inboxMsgsFor === msgSel && window._inboxMsgsState === 'ok'
                      ? '<div class="msg-empty">Is chat mein abhi koi message nahi.</div>'
                      : '<div class="msg-empty">Messages load ho rahe hain…</div>'))}
          </div>
          ${w.open ? inboxReplyBarHtml(msgs) : ''}
          ${w.open ? `<div class="msg-reply">
            <button class="msg-ico" title="Photo / Video / Voice bhejein" ${msgSending ? 'disabled' : ''} onclick="document.getElementById('msg-file').click()">📎</button>
            <textarea id="msg-input" class="input" rows="1" placeholder="Jawab likhein… (Ctrl+Enter = bhejein)" ${msgSending ? 'disabled' : ''} onkeydown="if(event.ctrlKey&&event.key==='Enter')sendInboxReply()"></textarea>
            <input type="file" id="msg-file" accept="image/jpeg,image/png,video/mp4,video/3gpp,audio/*" style="display:none" onchange="sendInboxMedia(this)">
            <button class="msg-ico${msgRecording ? ' rec' : ''}" title="Awaaz record karein" ${msgSending ? 'disabled' : ''} onclick="toggleVoiceRec()">${msgRecording ? '⏹ Bhejein' : '🎤'}</button>
            <button class="btn btn-primary msg-send" title="Bhejein" ${msgSending ? 'disabled' : ''} onclick="sendInboxReply()">${msgSending ? '…' : '➤'}</button>
          </div>` : ''}
          ${(msgCfgOpen || (w.open && !(inboxCfg().url && inboxCfg().key))) ? `<div class="msg-cfg">
            <div><b>Jawab bhejne ki setting</b> (sirf is device par save hoti hai)</div>
            <input id="msg-cfg-url" class="input" placeholder="Server ka link, jaise https://xxxx.onrender.com" value="${khEsc(msgCfgDraft.url || inboxCfg().url || '')}">
            <input id="msg-cfg-key" class="input" type="password" placeholder="${inboxCfg().key ? 'Password save hai (badalna ho to likhein)' : 'Password'}" value="${khEsc(msgCfgDraft.key || '')}">
            <div><button class="btn btn-sm btn-dark" onclick="saveInboxCfg()">Save karein</button></div>
          </div>` : ''}
          <div class="msg-foot">
            ${w.open ? '<span>Jawab yahan se ya phone ki Business app se de sakte hain.</span>' : '<span>24 ghante guzar gaye — yahan se jawab nahi ja sakta. WhatsApp se template bhejein.</span>'}
            <a class="btn btn-sm btn-outline" href="https://wa.me/${khEsc(msgSel)}" target="_blank" rel="noopener">WhatsApp kholein</a>
            <button class="btn btn-sm btn-primary" onclick="openDeliveryForm()">🛵 Delivery Order</button>
            <button class="btn btn-sm btn-outline" onclick="toggleMsgCfg()">⚙️ Setting</button>
          </div>`;
      }

      v.innerHTML = `<div class="card msg-wrap ${msgSel ? 'has-sel' : ''} ${msgFull ? 'full' : ''}">
        <div class="msg-list">
          <div class="msg-lh">
            <div class="msg-lh-top">
              <div class="msg-nb">NB</div>
              <div style="flex:1;min-width:0;"><div class="msg-lh-t">Karachi Noor Biryani</div><div class="msg-lh-s">+92 300 5583968</div></div>
              <button type="button" class="msg-bell" title="Awaaz on/off" onclick="toggleInboxSound()">${inboxSoundOn() ? '🔔' : '🔕'}</button>
              <button type="button" class="msg-bell" title="${msgFull ? 'POS ke tabs par wapis' : 'Poori screen'}" onclick="toggleMsgFull()" style="width:auto;padding:0 12px;font-size:13px;border-radius:18px;">${msgFull ? '⬅ POS' : '⛶'}</button>
            </div>
            <input class="input msg-search" placeholder="Naam ya number dhoondein" value="${khEsc(msgSearch)}" onchange="setMsgSearch(this.value)">
            <div class="msg-chips"><span class="chip ${msgFilter === 'all' ? 'on' : ''}" onclick="setMsgFilter('all')">All</span><span class="chip ${msgFilter === 'unread' ? 'on' : ''}" onclick="setMsgFilter('unread')">Unread ${unreadChats}</span></div>
          </div>
          ${listHtml}
        </div>
        <div class="msg-pane">${pane}</div>
      </div>`;
      fitMsgWrap();
      const fl = document.getElementById('msg-flow');
      if (fl) {
        if (msgForceBottom || flowWasBottom) fl.scrollTop = fl.scrollHeight; else fl.scrollTop = flowTop;
        if (window._inboxMsgsFor === msgSel && window._inboxMsgsState !== 'loading') msgForceBottom = false;
      }
      const nl = v.querySelector('.msg-list');
      if (nl) nl.scrollTop = listTop;
      const ni = document.getElementById('msg-input');
      if (ni) { ni.value = msgDraft; if (hadFocus && !msgSending) { ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); } }
    }

    // Initialize View
    setFbStaff(appData.staff.slice());
    setTab('dashboard');
  </script>

  <!-- Firebase Firestore connection (customer orders cloud mein save honge) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, onSnapshot, serverTimestamp, query, orderBy, limit }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBv6f3gkWaERS7K7KhStUSVGVxfuq-11jE",
      authDomain: "karachi--noor-biryani.firebaseapp.com",
      projectId: "karachi--noor-biryani",
      storageBucket: "karachi--noor-biryani.firebasestorage.app",
      messagingSenderId: "354512185119",
      appId: "1:354512185119:web:534218ae25afe96bc4322a"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    // Order ko restaurants/karachi-noor/orders/{orderId} mein save karta hai
    window.saveOrderToFirestore = (order) =>
      setDoc(doc(db, "restaurants/karachi-noor/orders", order.id),
        { ...order, createdAt: serverTimestamp() });

    // Riders (registry + live location): restaurants/karachi-noor/riders/{phone}
    window.saveRiderToFirestore = (id, data) => setDoc(doc(db, "restaurants/karachi-noor/riders", id), data, { merge: true });
    window.deleteRiderFromFirestore = (id) => deleteDoc(doc(db, "restaurants/karachi-noor/riders", id));
    onSnapshot(collection(db, "restaurants/karachi-noor/riders"),
      snap => setFbRiders(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      e => { console.warn('Riders live load failed:', e); if (window.setRiderErr) window.setRiderErr(e.code === 'permission-denied' ? 'Firestore rules riders ko allow nahi kar rahe (permission-denied)' : (e.message || 'Riders load nahi hue')); });

    // Staff: restaurants/karachi-noor/staff/{id}
    // Order status update (merge) + live orders listener
    window.updateOrderInFirestore = (id, patch) =>
      setDoc(doc(db, "restaurants/karachi-noor/orders", id), patch, { merge: true });

    onSnapshot(collection(db, "restaurants/karachi-noor/orders"), snap => {
      appData.orders = snap.docs.map(d => normalizeOrder(d.id, d.data()));
      onOrdersChanged(snap.docChanges());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      if (document.getElementById('view-dashboard').style.display !== 'none') renderDashboard();
    }, e => console.warn('Orders live load failed:', e));

    // Print History (har parchi): restaurants/karachi-noor/prints/{id}
    window.savePrintToFirestore = (s) =>
      setDoc(doc(db, "restaurants/karachi-noor/prints", s.id), JSON.parse(JSON.stringify(s)))
        .catch(e => console.warn('Print log cloud save failed (Firestore rules check karein):', e));
    onSnapshot(collection(db, "restaurants/karachi-noor/prints"), snap => {
      const map = {};
      (appData.printLog || []).forEach(s => { map[s.id] = s; });
      snap.docs.forEach(d => { map[d.id] = d.data(); });
      appData.printLog = Object.values(map).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 500);
      const mx = appData.printLog.reduce((m, s) => Math.max(m, parseInt(String(s.no || '').replace(/\D/g, '')) || 0), 0);
      if (mx > (appData.printSeq || 0)) appData.printSeq = mx;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      const v = document.getElementById('view-prints');
      if (v && v.style.display !== 'none') renderPrints();
    }, e => console.warn('Print log live load failed:', e));

    // Khata (customers, suppliers, roznamcha) cloud backup: restaurants/karachi-noor/khata/main
    const khataRef = doc(db, "restaurants/karachi-noor/khata", "main");
    window.saveKhataToFirestore = (data) =>
      setDoc(khataRef, {
        customers: data.customers, suppliers: data.suppliers, roznamcha: data.roznamcha, menu: data.menu || [], stock: data.stock, stockLog: data.stockLog || [], staff: data.staff || [], sheet: data.sheet || null,
        updatedAt: serverTimestamp()
      }).catch(e => console.warn('Khata cloud save failed:', e));

    // Page khulne par cloud se khata load karo (agar maujood ho)
    getDoc(khataRef).then(snap => {
      if (!snap.exists()) { window.saveKhataToFirestore(appData); return; }
      const d = snap.data();
      if (Array.isArray(d.customers)) appData.customers = d.customers;
      if (Array.isArray(d.suppliers)) appData.suppliers = d.suppliers;
      if (Array.isArray(d.roznamcha)) appData.roznamcha = d.roznamcha;
      if (Array.isArray(d.menu) && d.menu.length) appData.menu = migrateMenuCats(d.menu);
      if (Array.isArray(d.stock)) appData.stock = d.stock;
      if (Array.isArray(d.stockLog)) appData.stockLog = d.stockLog;
      if (Array.isArray(d.staff)) { appData.staff = d.staff; setFbStaff(appData.staff.slice()); }
      if (d.sheet) { appData.sheet = d.sheet; sendOrdersToSheet(appData.orders.filter(o => !(appData.sheetSynced || {})[o.id])); }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      if (document.getElementById('view-khata').style.display !== 'none') renderKhata();
      if (document.getElementById('view-stock').style.display !== 'none') renderStock();
      if (document.getElementById('view-pos').style.display !== 'none' && !document.getElementById('modals-root').innerHTML.trim()) renderPOS();
    }).catch(e => console.warn('Khata cloud load failed:', e));

    // Messages inbox (naya WhatsApp number): bot yahan save karta hai, POS sirf parhta hai
    const INBOX_PATH = "restaurants/karachi-noor/inbox_chats";
    onSnapshot(collection(db, INBOX_PATH), snap => {
      window._inboxChats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      try {
        const tm = t => (t && typeof t.toMillis === 'function') ? t.toMillis() : 0;
        const prev = window._inboxPrev, cur = {}; let gotIn = false, gotOut = false;
        window._inboxChats.forEach(c => {
          const i = tm(c.lastInboundAt), l = tm(c.lastMessageAt);
          cur[c.id] = { i, l };
          if (prev) {
            const p = prev[c.id] || { i: 0, l: 0 };
            if (i > p.i) gotIn = true;
            else if (l > p.l && c.lastDirection === 'out') gotOut = true;
          }
        });
        window._inboxPrev = cur;
        if (gotIn) window.inboxSound('in'); else if (gotOut) window.inboxSound('out');
      } catch (e) { console.warn('sound', e); }
      if (window.onInboxChats) window.onInboxChats();
    }, e => console.warn('Inbox load failed (Firestore rules check karein):', e));

    let inboxUnsub = null;
    window.deleteInboxMsgDoc = (phone, docId) => deleteDoc(doc(db, INBOX_PATH + "/" + phone + "/messages", docId));
    window.markInboxRead = (phone) =>
      setDoc(doc(db, INBOX_PATH, phone), { unreadCount: 0 }, { merge: true }).catch(() => {});
    window.openInboxChat = (phone) => {
      if (inboxUnsub) { inboxUnsub(); inboxUnsub = null; }
      window._inboxMsgs = [];
      window._inboxMsgsState = 'loading';
      window._inboxMsgsFor = phone;
      const q = query(collection(db, INBOX_PATH + "/" + phone + "/messages"), orderBy("timestamp", "desc"), limit(200));
      inboxUnsub = onSnapshot(q, snap => {
        window._inboxMsgs = snap.docs.map(d => Object.assign({}, d.data(), { _docId: d.id })).reverse();
        window._inboxMsgsState = 'ok';
        if (window.onInboxChats) window.onInboxChats();
      }, e => { console.warn('Inbox messages load failed:', e); window._inboxMsgsState = 'error'; if (window.onInboxChats) window.onInboxChats(); });
      window.markInboxRead(phone);
    };
  </script>
</body>
