<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Rider App - Karachi Noor Biryani</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card2:#1a2540; --line:#243250;
    --text:#f1f5f9; --muted:#8fa0bd; --amber:#f59e0b; --amber2:#d97706;
    --green:#10b981; --red:#f43f5e; --blue:#3b82f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  .hidden{display:none!important}

  /* Header */
  .top{background:linear-gradient(135deg,#b45309,#f59e0b);padding:calc(18px + env(safe-area-inset-top)) 18px 46px;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(245,158,11,.25)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px}
  .brand h1{margin:0;font-size:17px;font-weight:800;color:#fff;line-height:1.2}
  .brand p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.85)}
  .wrap{max-width:480px;margin:-30px auto 0;padding:0 16px 28px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .title{font-size:15px;font-weight:800;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13px}

  /* Login */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:14px;letter-spacing:.3px;text-transform:uppercase}
  input{width:100%;padding:14px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:#fff;font-size:17px;margin-top:6px;outline:none}
  input:focus{border-color:var(--amber)}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;color:#fff;margin-top:16px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber2))}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-weight:700;padding:12px;font-size:14px}
  .err{color:#fda4af;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px}

  /* Profile + status */
  .profile{display:flex;align-items:center;gap:12px}
  .avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
  .pname{font-weight:800;font-size:17px}
  .pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:800}
  .pill .dot{width:9px;height:9px;border-radius:50%}
  .pill.off{background:#1f2a44;color:var(--muted)} .pill.off .dot{background:#64748b}
  .pill.on{background:rgba(16,185,129,.15);color:#6ee7b7} .pill.on .dot{background:var(--green);animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}

  /* Big start/stop */
  .gps{text-align:center;padding:26px 18px}
  .bigbtn{width:150px;height:150px;border-radius:50%;border:0;color:#fff;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0 auto;cursor:pointer}
  .bigbtn .ic{font-size:36px;line-height:1}
  .bigbtn.start{background:radial-gradient(circle at 30% 25%,#34d399,#059669);box-shadow:0 0 0 10px rgba(16,185,129,.12),0 14px 30px rgba(5,150,105,.4)}
  .bigbtn.stop{background:radial-gradient(circle at 30% 25%,#fb7185,#e11d48);box-shadow:0 0 0 10px rgba(244,63,94,.12),0 14px 30px rgba(225,29,72,.4)}
  .bigbtn:active{transform:scale(.97)}
  #gpsInfo{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.5}

  /* Orders */
  .oh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .count{background:var(--amber);color:#1c1200;font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px}
  .order{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .o1{display:flex;justify-content:space-between;align-items:center}
  .onum{font-weight:800;font-size:15px}
  .oamt{font-weight:800;color:var(--amber);font-size:15px}
  .ocust{margin-top:8px;font-weight:700;font-size:15px}
  .oaddr{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.45}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .acts a{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:800;font-size:14px;padding:12px;border-radius:12px}
  .call{background:var(--blue)} .nav{background:#7c3aed}
  .ar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .ar button{border:0;color:#fff;font-weight:800;font-size:15px;padding:14px;border-radius:12px}
  .acc{background:linear-gradient(135deg,#10b981,#059669)} .rej{background:linear-gradient(135deg,#f43f5e,#e11d48)}
  .accd{margin-top:10px;text-align:center;color:#34d399;font-weight:800;font-size:14px}
  .done{margin-top:10px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;width:100%;border-radius:12px;padding:14px;font-size:15px;font-weight:800}
  .empty{text-align:center;padding:22px 0 8px;color:var(--muted);font-size:14px}
  .empty .big{font-size:34px;display:block;margin-bottom:6px}
  .foot{text-align:center;color:#51617f;font-size:11px;margin-top:8px}
</style>
<link rel="manifest" href="rider-manifest.json">
<meta name="theme-color" content="#d97706">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="rider-icon-192.png">
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="logo">🍛</div>
    <div>
      <h1>Karachi Noor Biryani</h1>
      <p>Rider App</p>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <p class="title">Rider Login</p>
    <div class="muted">Apna phone number aur PIN likhein</div>
    <label for="phone">Phone Number</label>
    <input id="phone" inputmode="numeric" maxlength="11" placeholder="03XXXXXXXXX" autocomplete="tel">
    <label for="pin">4 Digit PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password">
    <button class="btn btn-amber" onclick="doLogin()">Login</button>
    <div id="loginErr" class="err hidden"></div>
  </div>

  <!-- MAIN -->
  <div id="mainBox" class="hidden">

    <div class="card">
      <div class="profile">
        <div class="avatar" id="avatar">R</div>
        <div class="pname" id="rName">Rider</div>
        <span id="stBadge" class="pill off"><span class="dot"></span><span id="stText">OFFLINE</span></span>
      </div>
    </div>

    <div class="card gps">
      <button id="startBtn" class="bigbtn start" onclick="startShare()"><span class="ic">▶</span>START</button>
      <button id="stopBtn" class="bigbtn stop hidden" onclick="stopShare()"><span class="ic">■</span>STOP</button>
      <div id="gpsInfo">Start dabayein aur location ki permission "Allow" karein. Kaam ke dauran screen on rakhein.</div>
    </div>

    <div class="card">
      <div class="oh">
        <p class="title" style="margin:0">📦 Mere Orders</p>
        <span class="count" id="ocount">0</span>
      </div>
      <div id="orders"><div class="empty"><span class="big">🛵</span>Abhi koi order nahi</div></div>
    </div>

  <button class="btn btn-amber" onclick="if(navigator.share){navigator.share({title:'Noor Rider',url:'https://sheikhazeem6666-sheikh.github.io/NOOR-POS/rider.html'})}else{prompt('Link copy karein','https://sheikhazeem6666-sheikh.github.io/NOOR-POS/rider.html')}">📤 App Share Karein</button>  <button class="btn btn-ghost" onclick="logout()">Logout</button>
  </div>

  <div class="foot">Karachi Noor Biryani &amp; Murgh Pulao</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBv6f3gkWaERS7K7KhStUSVGVxfuq-11jE",
  authDomain: "karachi--noor-biryani.firebaseapp.com",
  projectId: "karachi--noor-biryani",
  storageBucket: "karachi--noor-biryani.firebasestorage.app",
  messagingSenderId: "354512185119",
  appId: "1:354512185119:web:534218ae25afe96bc4322a"
});
const db = getFirestore(app);
const BASE = "restaurants/karachi-noor";
  const fmtT = o => { const t = o.createdAt || o.ts || o.time || o.date || o.created || o.createdMs || o.timestamp || o.placedAt || o.dispatchedAt || o.riderAssignedAt; if (!t) return ''; try { const d = t.toDate ? t.toDate() : new Date(t); if (isNaN(d)) return String(t); return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); } catch (e) { return ''; } };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let me = null, watchId = null, wakeLock = null, unsubOrders = null, lastSent = 0;

function showErr(m){ const e=$('loginErr'); e.textContent=m; e.classList.toggle('hidden', !m); }
function setStatus(on){
  $('stBadge').className = 'pill ' + (on ? 'on' : 'off');
  $('stText').textContent = on ? 'ONLINE' : 'OFFLINE';
  if(me){ setDoc(doc(db, BASE + "/riders", me.id), { online: on, onlineAt: serverTimestamp() }, { merge: true }).catch(e=>showErr('Online save nahi hua: ' + e.message)); }
}

window.doLogin = async function () {
  const phone = $('phone').value.trim(), pin = $('pin').value.trim();
  showErr('');
  if (!/^03\d{9}$/.test(phone) || !/^\d{4}$/.test(pin)) { showErr('Phone 11 digit aur PIN 4 digit likhein'); return; }
  try {
    const snap = await getDoc(doc(db, BASE + "/riders", phone));
    if (!snap.exists() || String(snap.data().pin) !== pin) { showErr('Phone ya PIN galat hai'); return; }
    me = { id: phone, ...snap.data() };
    localStorage.setItem('riderLogin', JSON.stringify({ phone, pin }));
    showMain();
  } catch (e) {
    showErr('Login nahi hua: ' + (e.code === 'permission-denied' ? 'Firestore rules allow nahi kar rahe' : e.message));
  }
};

function showMain() {
  $('loginBox').classList.add('hidden');
  $('mainBox').classList.remove('hidden');
  const n = me.name || me.id;
  $('rName').textContent = n;
  $('avatar').textContent = String(n).trim().charAt(0).toUpperCase() || 'R';
  listenOrders();
}

window.logout = function () {
  stopShare();
  if (unsubOrders) unsubOrders();
  localStorage.removeItem('riderLogin');
  me = null;
  $('mainBox').classList.add('hidden');
  $('loginBox').classList.remove('hidden');
};

window.startShare = async function () {
  if (!navigator.geolocation) { $('gpsInfo').textContent = 'Is phone mein location support nahi hai'; return; }
  if (!window.isSecureContext) {
    $('gpsInfo').textContent = 'Yeh page https website se khulna chahiye (file se location nahi chalti).';
    return;
  }
  $('gpsInfo').textContent = 'Location dhoondi ja rahi hai...';
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  $('startBtn').classList.add('hidden');
  $('stopBtn').classList.remove('hidden');
};

let lastLat = null, lastLng = null, lastFixMs = 0;
function distM(a, b, c, d) {
  const R = 6371000, t = Math.PI / 180, dLa = (c - a) * t, dLo = (d - b) * t;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
async function onPos(p) {
  const now = Date.now();
  const c = p.coords;
  lastFixMs = now;
  const acc = c.accuracy || 0;
  // Kharab (door ki andaze wali) location ignore karo
  if (acc > 80) {
    $('gpsInfo').textContent = 'GPS kamzor hai (±' + Math.round(acc) + ' m). Khuli jagah par aayein...';
    return;
  }
  const moved = lastLat == null ? 999 : distM(lastLat, lastLng, c.latitude, c.longitude);
  // Har 3 second mein sirf tab bhejo jab 8 m se zyada hile; khare hon to har 20 second
  if (now - lastSent < 3000) return;
  if (moved < 8 && now - lastSent < 20000) return;
  lastSent = now; lastLat = c.latitude; lastLng = c.longitude;
  try {
    await setDoc(doc(db, BASE + "/riders", me.id), {
      lat: c.latitude, lng: c.longitude, speed: c.speed || 0,
      accuracy: Math.round(acc), heading: c.heading == null ? null : c.heading,
      sharing: true, lastMs: now, updatedAt: serverTimestamp()
    }, { merge: true });
    setStatus(true);
    $('gpsInfo').textContent = 'Location ja rahi hai ✅ ' + new Date().toLocaleTimeString() + ' (±' + Math.round(acc) + ' m)';
  } catch (e) {
    $('gpsInfo').textContent = 'Location bhejne mein masla: ' + e.message;
  }
}

function onPosErr(e) {
  setStatus(false);
  $('gpsInfo').textContent = e.code === 1
    ? 'Location ki permission band hai. Browser settings mein Location "Allow" karein.'
    : 'Location nahi mil rahi: ' + e.message;
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || watchId == null) return;
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  // wapas aane par GPS dobara shuru karo taake atka hua nishan foran hile
  try {
    navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  } catch (e) {}
});
// Agar 45 second se koi location nahi mili to rider ko bataao
setInterval(() => {
  if (watchId != null && document.visibilityState === 'visible' && lastFixMs && Date.now() - lastFixMs > 45000) {
    $('gpsInfo').textContent = '⚠️ Location nahi mil rahi. Phone ki Location/High accuracy ON karein aur app khuli rakhein.';
  }
}, 15000);

window.stopShare = async function () {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
  if (me) { try { await setDoc(doc(db, BASE + "/riders", me.id), { sharing: false }, { merge: true }); } catch (e) {} }
  setStatus(false);
  $('startBtn').classList.remove('hidden');
  $('stopBtn').classList.add('hidden');
  $('gpsInfo').textContent = 'Location band hai.';
};

// ---- Naye order ki ghanti (rider) ----
let ac = null, seenOrders = null, bellTimer = null;
function unlockAudio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
['click', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
function bell() {
  try {
    unlockAudio(); const t0 = ac.currentTime + 0.02;
    [[880, 0], [1320, .22], [880, .5], [1320, .72]].forEach(([f, st]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + st);
      g.gain.exponentialRampToValueAtTime(0.6, t0 + st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + st + 0.2);
      o.connect(g); g.connect(ac.destination); o.start(t0 + st); o.stop(t0 + st + 0.22);
    });
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  } catch (e) {}
}
function stopBell() { if (bellTimer) { clearInterval(bellTimer); bellTimer = null; } const b = document.getElementById('newbar'); if (b) b.remove(); }
window.stopBell = stopBell; // module script hai, isliye OK button ko global chahiye
function showBar(msg, color) {
  stopBell();
  const d = document.createElement('div'); d.id = 'newbar';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:' + color + ';color:#fff;padding:16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;';
  d.innerHTML = '<span style="font-size:24px;">🔔</span><span style="flex:1;">' + msg + '</span><button style="background:#fff;color:' + color + ';border:0;border-radius:8px;padding:9px 14px;font-weight:800;" onclick="stopBell()">OK</button>';
  document.body.appendChild(d);
  let n = 0; bell();
  bellTimer = setInterval(() => { if (++n > 20) stopBell(); else bell(); }, 3000);
}
let prevOrders = new Map(), selfLeft = new Set();
function riderAlert(list, cancelled) {
  const ids = list.map(o => o.id);
  if (seenOrders === null) { seenOrders = new Set(ids); return; }
  const fresh = list.filter(o => !seenOrders.has(o.id));
  seenOrders = new Set(ids); // sirf maujooda orders yaad rakho, taake wahi order dobara aaye to bell baje
  if (!fresh.length && !cancelled.length) return;
  const parts = [];
  if (fresh.length) parts.push('Naya order mila!');
  if (cancelled.length) parts.push('❌ Order cancel ho gaya: ' + cancelled.map(esc).join(', '));
  showBar(parts.join('<br>'), fresh.length ? '#dc2626' : '#b45309');
}

function listenOrders() {
  if (unsubOrders) unsubOrders();
  seenOrders = null; prevOrders = new Map();
  const q = query(collection(db, BASE + "/orders"), where("riderId", "==", me.id));
  unsubOrders = onSnapshot(q, snap => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const list = all.filter(o => String(o.status || '').toLowerCase() === 'dispatched');
    const cancelled = [];
    prevOrders.forEach((label, id) => {
      if (list.some(o => o.id === id)) return;
      const cur = all.find(o => o.id === id);
      const st = cur ? String(cur.status || '').toLowerCase() : '';
      if (st === 'delivered' || selfLeft.has(id)) return; // rider ne khud deliver ya reject kiya
      cancelled.push(label);
    });
    prevOrders = new Map(list.map(o => [o.id, String(o.num || o.orderNumber || o.id)]));
    riderAlert(list, cancelled);
    $('ocount').textContent = list.length;
    if (!list.length) { $('orders').innerHTML = '<div class="empty"><span class="big">🛵</span>Abhi koi order nahi</div>'; return; }
    $('orders').innerHTML = list.map(o => {
      const phone = o.phone || o.customerPhone || o.from || '';
      const addr = o.addr || o.address || '';
      const amount = Number(o.amount ?? o.total ?? o.totalAmount ?? 0).toLocaleString();
      const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr + ' ' + (o.area || ''));
      return `<div class="order">
        <div class="o1"><span class="onum">${esc(o.num || o.orderNumber || o.id)}</span><span class="oamt">PKR ${esc(amount)}</span></div>
        <div class="oaddr">🕒 ${esc(fmtT(o))}</div>
        <div class="ocust">👤 ${esc(o.name || o.customerName || 'Customer')}</div>
        <div class="oaddr">📍 ${esc(addr)} ${esc(o.area || '')}</div>
        <div class="acts">
          ${phone ? `<a class="call" href="tel:${esc(phone)}">📞 Call</a>` : '<span></span>'}
          ${addr ? `<a class="nav" href="${map}" target="_blank" rel="noopener">🗺️ Map</a>` : '<span></span>'}
        </div>
        ${o.riderAccepted
          ? `<div class="accd">✅ Aap ne accept kar liya</div>
        <button class="done" onclick="markDelivered('${esc(o.id)}')">✅ Delivered</button>`
          : `<div class="ar">
          <button class="acc" onclick="acceptOrder('${esc(o.id)}')">✅ Accept</button>
          <button class="rej" onclick="rejectOrder('${esc(o.id)}')">❌ Reject</button>
        </div>`}
      </div>`;
    }).join('');
  }, e => { $('orders').innerHTML = '<div class="empty">Orders load nahi hue: ' + esc(e.message) + '</div>'; });
}

window.acceptOrder = async function (id) {
  stopBell();
  try {
    await setDoc(doc(db, BASE + "/orders", id), {
      riderAccepted: true, riderAcceptedAt: serverTimestamp(), riderRejected: false
    }, { merge: true });
  } catch (e) { alert('Accept nahi hua: ' + e.message); }
};

window.rejectOrder = async function (id) {
  if (!confirm('Kya aap ye order reject karna chahte hain?')) return;
  stopBell();
  selfLeft.add(id);
  try {
    await setDoc(doc(db, BASE + "/orders", id), {
      riderId: null, riderAccepted: false, riderRejected: true,
      rejectedBy: me.id, rejectedByName: me.name || me.id, rejectedAt: serverTimestamp()
    }, { merge: true });
  } catch (e) { selfLeft.delete(id); alert('Reject nahi hua: ' + e.message); }
};

window.markDelivered = async function (id) {
  if (!confirm('Order deliver ho gaya?')) return;
  try { await setDoc(doc(db, BASE + "/orders", id), { status: 'delivered' }, { merge: true }); }
  catch (e) { alert('Update nahi hua: ' + e.message); }
};

try {
  const s = JSON.parse(localStorage.getItem('riderLogin') || 'null');
  if (s) { $('phone').value = s.phone; $('pin').value = s.pin; window.doLogin(); }
} catch (e) {}
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('rider-sw.js').catch(function () {}); }); }
</script>
